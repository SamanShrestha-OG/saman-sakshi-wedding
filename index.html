<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sakshi & Saman</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- Elegant Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Tangerine:wght@700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- HERO -->
 <!-- VIDEO HERO -->
<section class="video-hero">
  <video
    class="hero-video"
    autoplay
    loop
    muted
    playsinline
  >
    <source src="videos/wedding.mp4" type="video/mp4" />
    Your browser does not support the video tag.
  </video>

  <div class="video-overlay">
    <h1 class="names">Sakshi & Saman</h1>
    <p class="date">March 11, 2026 · Dallas, Texas</p>
    <a href="#rsvp" class="btn-primary">RSVP</a>
  </div>
</section>


  <!-- DETAILS -->
  <section class="details">
    <h2>Wedding Details</h2>
    <p><strong>Date:</strong> Wednesday, March 11, 2026</p>
    <p><strong>Location:</strong> Dallas, Texas</p>
    <p><strong>Dress Code:</strong> South Asian Festive</p>
  </section>

  <!-- RSVP -->
  <section id="rsvp" class="rsvp">
    <h2>Kindly Respond</h2>

    <form id="rsvpForm" class="rsvp-form">
      <input type="text" name="name" placeholder="Full Name" required />
      <input type="email" name="email" placeholder="Email Address" required />

      <select name="attending" required>
        <option value="">Will you attend?</option>
        <option value="yes">Joyfully Accept</option>
        <option value="no">Regretfully Decline</option>
      </select>

      <input type="number" name="guests" min="1" max="10" placeholder="Number of Guests" required />

      <textarea name="notes" placeholder="Dietary needs or message"></textarea>

      <button type="submit">Submit RSVP</button>
      <p id="formStatus" class="status"></p>
    </form>
  </section>

  <!-- FOOTER -->
  <footer>
    <p>With love, Sakshi & Saman</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
