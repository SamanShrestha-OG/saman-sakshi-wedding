<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sakshi & Saman | Save the Date</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Allura&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<section class="hero-triptych">

  <!-- ✅ LEFT PHOTO -->
  <div class="hero-side">
    <img src="images/17.jpg" alt="Sakshi & Saman left photo">
  </div>

  <!-- ✅ CENTER VIDEO -->
  <div class="hero-center premium-video">
    <video autoplay loop muted playsinline preload="auto">
      <source src="./videos/wedding.mp4" type="video/mp4">
    </video>

    <div class="video-vignette"></div>
    <div class="video-grain"></div>
      <!-- ✅ HERO TEXT OVERLAY -->
  <div class="hero-text-overlay">
    <h2 class="hero-overlay-names">Sakshi &amp; Saman</h2>
    <p class="hero-overlay-date">March 11, 2026 · Dallas, Texas</p>
  </div>
  </div>

  <!-- ✅ RIGHT PHOTO -->
  <div class="hero-side">
    <img src="images/11.jpg"Sakshi & Saman right photo">
  </div>

</section>

  <main class="invite-wrapper">

    <!-- RINGS ICON (TEXT ONLY VERSION) -->
    <div class="rings">○ ○</div>

    <!-- MONTH + CALENDAR -->
    <h2 class="month">MARCH</h2>

    <div class="calendar">
      <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span>
      <span>Thu</span><span>Fri</span><span>Sat</span>

      <span>8</span><span>9</span><span>10</span>
      <span class="heart-day">11</span>
      <span>12</span><span>13</span><span>14</span>
    </div>

    <!-- SAVE THE DATE -->
    <p class="save-script">save the date</p>
    <p class="small-text">for the wedding of</p>

    <!-- NAMES -->
    <h1 class="names">Sakshi &amp; Saman</h1>

    <!-- DATE -->
    <p class="event-date">
      Wednesday, March 11, 2026<br>
      Three o’clock in the afternoon
    </p>

    <!-- LOCATION -->
    <p class="location">
      Dallas, Texas
    </p>

    <p class="rsvp-note">Reception to follow</p>

    <!-- RSVP BUTTON -->
    <a href="#rsvp" class="rsvp-btn">RSVP</a>

  </main>

  <!-- RSVP SECTION -->
  <section id="rsvp" class="rsvp-section">
    <h2 class="rsvp-title">Kindly Respond</h2>

    <form id="rsvpForm" class="rsvp-form">
      <input name="name" placeholder="Full Name" required>
      <input name="email" type="email" placeholder="Email Address" required>
      <input name="guests" type="number" min="1" max="10" placeholder="Number of Guests" required>

      <select name="attending" required>
        <option value="">Will you attend?</option>
        <option value="Yes">Joyfully Accept</option>
        <option value="No">Regretfully Decline</option>
      </select>

      <textarea name="notes" placeholder="Dietary notes (optional)"></textarea>

      <button type="submit">Submit</button>
      <p id="formStatus"></p>
    </form>
  </section>

  <script src="script.js"></script>
</body>
</html>
